name: Observability dependency bootstrap

on:
  push:
    branches:
      - feat/observability-foundation

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/observability-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Vercel telemetry packages
        run: npm install --save-exact @vercel/analytics@2.0.1 @vercel/speed-insights@2.0.0
      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(observability): install Vercel telemetry packages"
          git push origin HEAD:feat/observability-foundation
