name: Supabase local gate

on:
  push:
    branches:
      - feat/supabase-integration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_POOL_MAX: 5
      INMOTRACK_ALLOW_DESTRUCTIVE_TESTS: 1
      NEXTAUTH_SECRET: inmotrack-ci-only-secret-not-for-production
      NEXTAUTH_URL: http://127.0.0.1:3000
      CHECKPOINT_DISABLE: 1
      PRISMA_HIDE_UPDATE_MESSAGE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx --no-install supabase start

      - name: Show local Supabase status
        run: npx --no-install supabase status

      - name: Reset local database
        run: npm run db:reset:local

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate ephemeral seed password
        run: echo "INMOTRACK_SEED_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Seed database
        run: npm run seed

      - name: Run tests
        run: npm test

      - name: Run coverage gate
        run: npm run test:coverage

      - name: Build application
        run: npx next build

      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop --no-backup
