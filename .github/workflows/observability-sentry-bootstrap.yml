name: Observability Sentry dependency bootstrap

on:
  push:
    branches:
      - feat/observability-http-sentry

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/observability-http-sentry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Sentry Next.js SDK
        run: npm install --save-exact @sentry/nextjs@10.74.0
      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(observability): install Sentry Next.js SDK"
          git push origin HEAD:feat/observability-http-sentry
