name: Queue TDD temporary gate

on:
  push:
    branches:
      - feat/contract-rent-adjustments

permissions:
  contents: read

jobs:
  queue-tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_POOL_MAX: 5
      INMOTRACK_ALLOW_DESTRUCTIVE_TESTS: 1
      CHECKPOINT_DISABLE: 1
      PRISMA_HIDE_UPDATE_MESSAGE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install supabase start
      - run: npm run db:reset:local
      - run: npx prisma generate
      - name: Run queue-focused tests
        run: node --import tsx --conditions=react-server --test --test-concurrency=1 tests/services/ajustes-contrato.service.test.ts tests/services/cierre-periodos-ajustes.service.test.ts
      - if: always()
        run: npx --no-install supabase stop --no-backup
